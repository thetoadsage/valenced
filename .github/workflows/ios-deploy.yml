name: "iOS: Deploy Build"
run-name: ${{ github.event.inputs.release == 'true' && 'Release' || 'Build' }} for ${{ github.event.inputs.ipa_url }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        default: ""
        description: "Direct HTTPS link to a clean decrypted Discord IPA; leave empty to build only the tweak"
        required: false
        type: string
      release:
        description: "Release the build"
        required: true
        type: boolean
      is_testflight:
        default: false
        description: "TestFlight build"
        required: true
        type: boolean
  workflow_call:
    inputs:
      ipa_url:
        required: true
        type: string
      is_testflight:
        required: true
        type: boolean
      release:
        required: false
        type: boolean
        default: true
      caller_workflow:
        required: false
        type: string

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc

      - name: Build packages
        run: ./gradlew :ios:packageTweak

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ios/packages/*-arm64.deb
          if-no-files-found: error

  build-ipa:
    if: inputs.caller_workflow != 'ci' && inputs.ipa_url != ''
    runs-on: macos-15
    needs: build-tweak

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output discord.ipa "$IPA_URL"

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' ios/control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' ios/control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Install cyan
        run: |
          python3 -m venv "$RUNNER_TEMP/cyan"
          "$RUNNER_TEMP/cyan/bin/pip" install https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip
          echo "$RUNNER_TEMP/cyan/bin" >> "$GITHUB_PATH"

      - name: Inject Valenced
        run: |
          cyan -g --overwrite -i discord.ipa -o "${{ env.APP_NAME }}.ipa" -f "${{ env.ROOTLESS_DEB_FILE_NAME }}"

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.APP_NAME }}.ipa
          if-no-files-found: error

  release-app:
    if: |
      inputs.caller_workflow != 'ci' &&
      (github.event.inputs.release == 'true' || inputs.release == true)
    runs-on: macos-15
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' ios/control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' ios/control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract Discord Version
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)

          if [[ "${{ github.event.inputs.is_testflight || inputs.is_testflight }}" == "true" ]]; then
            BUILD=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleVersion | cut -d '"' -f 4)
            VERSION="${VERSION}_${BUILD}"
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

          echo "DISCORD_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DISCORD_VERSION }}
          files: |
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}.ipa
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apt repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          script: |
            const assets = JSON.parse('${{ steps.create_release.outputs.assets }}');
            const debAsset = assets.find(asset => asset.name === '${{ env.ROOTLESS_DEB_FILE_NAME }}');

            if (!debAsset) {
              core.setFailed('Could not find DEB asset in release');
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'castdrian',
              repo: 'apt-repo',
              event_type: 'package-update',
              client_payload: {
                package_url: debAsset.browser_download_url,
                package_name: '${{ env.ROOTLESS_DEB_FILE_NAME }}'
              }
            });
