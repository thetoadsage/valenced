name: "iOS: Deploy Build"
run-name: ${{ github.event.inputs.release == 'true' && 'Release' || 'Build' }} for ${{ github.event.inputs.ipa_url }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        default: ""
        description: "Direct HTTPS link to a clean decrypted Discord IPA; leave empty to build only the tweak"
        required: false
        type: string
      release:
        description: "Release the build"
        required: true
        type: boolean
      ipa_encrypted:
        description: "Input is AES-256-CBC encrypted with IPA_PASSPHRASE"
        required: false
        default: false
        type: boolean
      ipa_sha256:
        description: "Expected SHA-256 of the decrypted input IPA"
        required: false
        default: ""
        type: string
      is_testflight:
        default: false
        description: "TestFlight build"
        required: true
        type: boolean
  workflow_call:
    inputs:
      ipa_url:
        required: true
        type: string
      ipa_encrypted:
        required: false
        default: false
        type: boolean
      ipa_sha256:
        required: false
        default: ""
        type: string
      is_testflight:
        required: true
        type: boolean
      release:
        required: false
        type: boolean
        default: true
      caller_workflow:
        required: false
        type: string
    secrets:
      IPA_PASSPHRASE:
        required: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc

      - name: Build packages
        run: ./gradlew :ios:packageTweak

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ios/packages/*-arm64.deb
          if-no-files-found: error

  build-ipa:
    if: inputs.caller_workflow != 'ci' && inputs.ipa_url != ''
    runs-on: macos-15
    needs: build-tweak

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_ENCRYPTED: ${{ inputs.ipa_encrypted }}
          IPA_PASSPHRASE: ${{ secrets.IPA_PASSPHRASE }}
          IPA_SHA256: ${{ inputs.ipa_sha256 }}
        run: |
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output discord.download "$IPA_URL"
          if [[ "$IPA_ENCRYPTED" == "true" ]]; then
            test -n "$IPA_PASSPHRASE"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -pass env:IPA_PASSPHRASE -in discord.download -out discord.ipa
            rm discord.download
          else
            mv discord.download discord.ipa
          fi
          if [[ -n "$IPA_SHA256" ]]; then
            printf '%s  discord.ipa\n' "$IPA_SHA256" | shasum -a 256 -c -
          fi
          python3 scripts/verify-ios.py discord.ipa --report input-report.json

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' ios/control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' ios/control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Install cyan
        run: |
          python3 -m venv "$RUNNER_TEMP/cyan"
          "$RUNNER_TEMP/cyan/bin/pip" install https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip
          echo "$RUNNER_TEMP/cyan/bin" >> "$GITHUB_PATH"

      - name: Inject Valenced
        run: |
          cyan -g --overwrite -i discord.ipa -o "${{ env.APP_NAME }}.ipa" -f "${{ env.ROOTLESS_DEB_FILE_NAME }}"

      - name: Verify injection and original Discord files
        run: |
          python3 scripts/verify-ios.py discord.ipa --output "${{ env.APP_NAME }}.ipa" --report verification.json
          shasum -a 256 "${{ env.APP_NAME }}.ipa" > SHA256SUMS

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            ${{ env.APP_NAME }}.ipa
            verification.json
            SHA256SUMS
          if-no-files-found: error

  release-app:
    if: |
      inputs.caller_workflow != 'ci' &&
      (github.event.inputs.release == 'true' || inputs.release == true)
    runs-on: macos-15
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' ios/control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' ios/control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract Discord Version
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)

          if [[ "${{ github.event.inputs.is_testflight || inputs.is_testflight }}" == "true" ]]; then
            BUILD=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleVersion | cut -d '"' -f 4)
            VERSION="${VERSION}_${BUILD}"
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

          echo "DISCORD_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DISCORD_VERSION }}
          files: |
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}.ipa
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
